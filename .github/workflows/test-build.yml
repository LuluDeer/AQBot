name: Test Build

on:
  push:
    tags:
      - 'test-v*.*.*'

permissions: write-all

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  test-build:
    name: Test Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: 'v1'
          key: '${{ matrix.os }}-${{ matrix.target }}'
          workspaces: src-tauri -> target

      - name: Install x86_64 OpenSSL (macOS Intel)
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          ARCH=$(uname -m)
          if [[ "$ARCH" != "x86_64" ]]; then
            echo "Expected x86_64 runner, got $ARCH"
            exit 1
          fi
          brew install openssl@3
          OPENSSL_PREFIX=$(brew --prefix openssl@3)
          echo "OPENSSL_DIR=$OPENSSL_PREFIX" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$OPENSSL_PREFIX/include" >> $GITHUB_ENV
          echo "OPENSSL_LIB_DIR=$OPENSSL_PREFIX/lib" >> $GITHUB_ENV

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get linked dependency versions
        id: dep-versions
        run: |
          SM_SHA=$(git -C libs/stream-monaco rev-parse HEAD)
          MS_SHA=$(git -C libs/markstream-vue rev-parse HEAD)
          echo "cache-key=${{ runner.os }}-${{ matrix.target }}-linked-deps-${SM_SHA:0:12}-${MS_SHA:0:12}" >> $GITHUB_OUTPUT

      - name: Cache linked dependencies
        id: cache-linked-deps
        uses: actions/cache@v4
        with:
          path: |
            libs/stream-monaco/node_modules
            libs/stream-monaco/dist
            libs/markstream-vue/node_modules
            libs/markstream-vue/packages/markdown-parser/node_modules
            libs/markstream-vue/packages/markdown-parser/dist
            libs/markstream-vue/packages/markstream-react/node_modules
            libs/markstream-vue/packages/markstream-react/dist
          key: ${{ steps.dep-versions.outputs.cache-key }}

      - name: Build linked dependencies
        if: steps.cache-linked-deps.outputs.cache-hit != 'true'
        run: |
          pnpm --dir libs/stream-monaco install --frozen-lockfile
          pnpm --dir libs/stream-monaco build

          pnpm --dir libs/markstream-vue install --frozen-lockfile
          pnpm --dir libs/markstream-vue run build:parser
          pnpm --dir libs/markstream-vue/packages/markstream-react build

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Import macOS release signing identity
        shell: bash
        timeout-minutes: 10
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: bash scripts/macos/import-ci-signing.sh

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AQBot ${{ github.ref_name }} (Test)'
          releaseBody: 'Internal test build for scrollbar fix verification.'
          releaseDraft: true
          prerelease: true
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }}

      - name: Verify macOS release signature
        shell: bash
        run: |
          APP_PATH="$(find "src-tauri/target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign --display --verbose=4 "$APP_PATH" 2>&1 | grep -F 'Authority=AQBot Release'

      - name: Clean up macOS signing identity
        if: always()
        shell: bash
        timeout-minutes: 5
        continue-on-error: true
        run: bash scripts/macos/cleanup-ci-signing.sh
